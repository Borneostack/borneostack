    <!-- Node Text -->
    <text x="48" y="20" class="font-sans node-title" fill="#065F46">TREATMENT (T)</text>
    <text x="48" y="32" class="font-sans node-sub" font-weight="500">Forest Loss &amp; Logging Roads</text>
    <text x="48" y="44" class="font-sans node-sub">Disturbance Area (ha / yr)</text>
    <rect x="48" y="48" width="92" height="11" rx="2" fill="#D1FAE5" />
    <text x="52" y="56.5" class="font-sans node-tag" fill="#047857">POLICY / DO(T) TARGET</text>
  </g>
  <!-- do(T) Intervention Indicator Callout -->
  <g id="do-T-intervention" transform="translate(110, 160)">
    <!-- Vertical intervention pulse line -->
    <line x1="0" y1="9" x2="0" y2="48" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-intervene)" />
    <!-- Pulse rings at entry -->
    <circle cx="0" cy="48" r="4" fill="none" stroke="#10B981" stroke-width="1" opacity="0.8" />
    
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect x="-56" y="-12" width="112" height="22" rx="11" fill="#065F46" stroke="#10B981" stroke-width="1" />
      <circle cx="-42" cy="-1" r="4.5" fill="#10B981" />
      <text x="-42" y="2" text-anchor="middle" class="font-mono" font-size="7px" font-weight="700" fill="#064E3B">✓</text>
      <text x="5" y="2.5" text-anchor="middle" class="font-mono" font-size="8.5px" font-weight="700" fill="#FFFFFF" letter-spacing="0.05em">do(T = t*)</text>
    </g>
  </g>
  <!-- Node M: Mediator -->
  <g id="node-M" transform="translate(295, 208)" filter="url(#cardShadow)">
    <rect width="170" height="64" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" />
    <rect x="0" y="0" width="5" height="64" rx="2.5" fill="#0F766E" />
    <!-- Node Icon Badge -->
