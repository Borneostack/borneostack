<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
<!-- Structural Causal Model (SCM) Directed Acyclic Graph: Borneo Hydro-Climate System -->
<defs>
  <style>
    .font-sans { font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    
    .scm-title { font-size: 11px; font-weight: 700; fill: #0F172A; letter-spacing: 0.08em; text-transform: uppercase; }
    .scm-eq { font-size: 8.5px; fill: #065F46; font-weight: 600; letter-spacing: 0.04em; }
    
    .node-title { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
    .node-sub { font-size: 8px; fill: #475569; letter-spacing: 0.01em; }
    .node-tag { font-size: 7px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    
    .edge-label { font-size: 7.5px; font-weight: 600; letter-spacing: 0.02em; }
    .edge-sub { font-size: 6.8px; fill: #64748B; font-weight: 500; }
    
    .legend-text { font-size: 7.5px; fill: #475569; font-weight: 500; letter-spacing: 0.02em; }
  </style>

  <!-- Marker Arrowheads -->
  <!-- Emerald Primary Causal Arrow -->
  <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#065F46" />
  </marker>
  <!-- Teal Mediated Arrow -->
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F766E" />
  </marker>
  <!-- Slate Confounder Arrow -->
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
  </marker>
  <!-- Dashed Latent Arrow -->
  <marker id="arrow-latent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
  </marker>
  <!-- Intervention Arrow -->
  <marker id="arrow-intervene" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
  </marker>

  <!-- Filter for card shadow -->
  <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05" />
  </filter>
  <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>
<rect width="760" height="360" fill="#FFFFFF" rx="8" />
<rect x="8" y="8" width="744" height="344" fill="none" stroke="#F1F5F9" stroke-width="1" rx="6" />
<g opacity="0.35">
