  <line x1="540" y1="12" x2="540" y2="348" stroke="#F1F5F9" stroke-width="0.75" />
  <line x1="570" y1="12" x2="570" y2="348" stroke="#F1F5F9" stroke-width="0.75" />
  <line x1="600" y1="12" x2="600" y2="348" stroke="#F1F5F9" stroke-width="0.75" />
  <line x1="630" y1="12" x2="630" y2="348" stroke="#F1F5F9" stroke-width="0.75" />
