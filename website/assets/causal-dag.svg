    <text x="26" y="36.5" text-anchor="middle" class="font-mono" font-size="12px" font-weight="700" fill="#FFFFFF">Y</text>
    <!-- Node Text -->
    <text x="48" y="20" class="font-sans node-title" fill="#991B1B">OUTCOME (Y)</text>
    <text x="48" y="32" class="font-sans node-sub" font-weight="500">Flash Flood Peak Amplitude</text>
    <text x="48" y="44" class="font-sans node-sub">Downstream Inundation Area</text>
    <rect x="48" y="48" width="92" height="11" rx="2" fill="#FEE2E2" />
    <text x="52" y="56.5" class="font-sans node-tag" fill="#B91C1C">HAZARD RESPONSE</text>
  </g>
</g>
<g id="footer-legend" transform="translate(24, 332)">
  <line x1="0" y1="0" x2="712" y2="0" stroke="#E2E8F0" stroke-width="0.8" />
  
  <g transform="translate(0, 12)">
    <!-- Legend 1: Intervention / Emerald -->
    <line x1="0" y1="0" x2="18" y2="0" stroke="#065F46" stroke-width="2.2" />
    <circle cx="9" cy="0" r="2.5" fill="#065F46" />
    <text x="24" y="3" class="font-sans legend-text">Direct Causal Pathway under do(T)</text>
    
    <!-- Legend 2: Mediated / Teal -->
    <line x1="195" y1="0" x2="213" y2="0" stroke="#0F766E" stroke-width="2.2" />
    <circle cx="204" cy="0" r="2.5" fill="#0F766E" />
    <text x="219" y="3" class="font-sans legend-text">Mediated Chain (T ➔ M ➔ Y)</text>
    
    <!-- Legend 3: Confounding / Slate -->
    <line x1="375" y1="0" x2="393" y2="0" stroke="#64748B" stroke-width="1.3" />
    <text x="399" y="3" class="font-sans legend-text">Confounding Backdoor (X)</text>
    
    <!-- Legend 4: Latent / Dashed -->
    <line x1="535" y1="0" x2="553" y2="0" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2" />
    <text x="559" y="3" class="font-sans legend-text">Unobserved Latent (U)</text>
    
    <!-- Legend 5: Cut / Surgery -->
    <rect x="665" y="-5.5" width="10" height="10" rx="2" fill="#FEF2F2" stroke="#F87171" stroke-width="0.6" />
    <text x="670" y="2.5" text-anchor="middle" class="font-mono" font-size="7px" fill="#DC2626">⊘</text>
    <text x="680" y="3" class="font-sans legend-text">Mutilated</text>
  </g>
</g>
