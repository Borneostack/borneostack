      <text x="0" y="3" text-anchor="middle" class="font-sans edge-label" fill="#475569">Orographic Saturation</text>
    </g>
  </g>
  <!-- Confounder Edge: X -> Y (Top Arched Pathway) -->
  <g id="edge-X-Y">
    <path d="M 320 85 C 410 42, 570 42, 655 208" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow-slate)" />
    <g transform="translate(485, 48)">
      <rect x="-62" y="-7" width="124" height="14" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="0.5" />
      <text x="0" y="3" text-anchor="middle" class="font-sans edge-label" fill="#475569">Basin Slope &amp; Monsoon Pluvial (X➔Y)</text>
    </g>
  </g>
  <!-- Latent Edges from U -->
  <g id="edges-latent-U">
    <!-- U -> M -->
    <path d="M 480 125 C 455 152, 425 178, 400 208" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-latent)" />
    <text x="444" y="166" class="font-mono edge-sub">u_soil</text>
    <!-- U -> Y -->
    <path d="M 555 125 C 575 152, 600 178, 625 208" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-latent)" />
    <text x="592" y="166" class="font-mono edge-sub">u_vapor</text>
  </g>
  <!-- Causal Path: T -> M -->
  <g id="edge-T-M">
    <path d="M 195 240 L 285 240" fill="none" stroke="#065F46" stroke-width="2.2" marker-end="url(#arrow-emerald)" />
    <g transform="translate(240, 230)">
      <rect x="-38" y="-8" width="76" height="16" rx="3" fill="#ECFDF5" stroke="#059669" stroke-width="0.8" />
      <text x="0" y="3" text-anchor="middle" class="font-mono" font-size="7.5px" font-weight="700" fill="#065F46">β_med1: α_loss</text>
    </g>
  </g>
  <!-- Causal Path: M -> Y -->
  <g id="edge-M-Y">
    <path d="M 475 240 L 565 240" fill="none" stroke="#0F766E" stroke-width="2.2" marker-end="url(#arrow-teal)" />
    <g transform="translate(520, 230)">
      <rect x="-40" y="-8" width="80" height="16" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="0.8" />
      <text x="0" y="3" text-anchor="middle" class="font-mono" font-size="7.5px" font-weight="700" fill="#0F766E">β_med2: Siltation</text>
    </g>
  </g>
  <!-- Direct Effect: T -> Y (Arched Underneath) -->
  <g id="edge-T-Y-direct">
    <path d="M 110 272 C 140 316, 620 316, 650 272" fill="none" stroke="#065F46" stroke-width="2.0" marker-end="url(#arrow-emerald)" />
    <g transform="translate(380, 310)">
      <rect x="-95" y="-8" width="190" height="17" rx="4" fill="#FFFFFF" stroke="#065F46" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="8px" font-weight="700" fill="#065F46">DIRECT CAUSAL PATH: β_direct (Canopy Runoff Velocity)</text>
    </g>
  </g>
</g>
<g id="causal-nodes">
