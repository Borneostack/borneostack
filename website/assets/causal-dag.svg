    <!-- Node Text -->
    <text x="48" y="20" class="font-sans node-title" fill="#0F766E">MEDIATOR (M)</text>
    <text x="48" y="32" class="font-sans node-sub" font-weight="500">Soil Moisture Saturation</text>
    <text x="48" y="44" class="font-sans node-sub">Stream Siltation &amp; Sediments</text>
    <rect x="48" y="48" width="94" height="11" rx="2" fill="#CCFBF1" />
    <text x="52" y="56.5" class="font-sans node-tag" fill="#0F766E">BIOPHYSICAL MECHANISM</text>
  </g>
  <!-- Node Y: Outcome -->
