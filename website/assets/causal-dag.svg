</g>
<g id="header" transform="translate(24, 22)">
  <rect x="0" y="0" width="3" height="24" fill="#065F46" rx="1.5" />
  <text x="12" y="11" class="font-sans scm-title">STRUCTURAL CAUSAL MODEL (SCM) · BORNEO HYDRO-CLIMATE SYSTEM</text>
  <text x="12" y="22" class="font-mono scm-eq">IDENTIFICATION: P(Y | do(T)) = ∑_{M,X} P(Y | T, M, X) · P(M | T, X) · P(X)  [PEARL'S BACKDOOR &amp; FRONTDOOR CRITERIA]</text>
  <line x1="0" y1="28" x2="712" y2="28" stroke="#E2E8F0" stroke-width="0.8" />
</g>
<g id="causal-edges">
  <!-- Confounder Edge: X -> T (Severed by do(T) surgery) -->
  <g id="edge-X-T">
    <path d="M 195 127 C 175 155, 145 175, 125 208" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow-slate)" />
    <!-- Severed backdoor pill badge -->
    <g transform="translate(142, 162)">
      <rect x="-38" y="-9" width="76" height="18" rx="4" fill="#FEF2F2" stroke="#F87171" stroke-width="0.8" />
      <text x="0" y="3" text-anchor="middle" class="font-mono" font-size="7px" font-weight="700" fill="#DC2626">⊘ BACKDOOR CUT</text>
    </g>
  </g>
  <!-- Confounder Edge: X -> M -->
  <g id="edge-X-M">
    <path d="M 285 127 C 315 155, 345 178, 365 208" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow-slate)" />
    <g transform="translate(340, 165)">
