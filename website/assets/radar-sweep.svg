<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <!-- Radial Glow -->
    <radialGradient id="radarRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d084" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepSector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d084" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <!-- Radar Pulse Filter -->
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="280" fill="url(#radarRadialGlow)"/>

  <!-- Radar Rings -->
  <circle cx="300" cy="300" r="60" stroke="#00d084" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="300" cy="300" r="120" stroke="#00d084" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="300" cy="300" r="180" stroke="#00d084" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="300" cy="300" r="240" stroke="#00d084" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="300" cy="300" r="285" stroke="#00d084" stroke-opacity="0.4" stroke-width="1.8"/>

  <!-- Crosshair Lines -->
  <line x1="15" y1="300" x2="585" y2="300" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="300" y1="15" x2="300" y2="585" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Diagonal Azimuth Grid -->
  <line x1="98" y1="98" x2="502" y2="502" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="98" y1="502" x2="502" y2="98" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sweeping Sector Arc -->
  <path d="M 300 300 L 500 100 A 285 285 0 0 1 585 300 Z" fill="url(#sweepSector)" opacity="0.7"/>

  <!-- Station Blips -->
  <!-- Blip 1: Kinabatangan -->
  <g transform="translate(420, 210)">
    <circle cx="0" cy="0" r="14" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1">
      <animate attributeName="r" values="6;18;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#radarGlow)"/>
    <text x="14" y="4" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">KB-04 Kinabatangan [Alert: Peak Runoff]</text>
  </g>

  <!-- Blip 2: Danum Valley -->
  <g transform="translate(210, 420)">
    <circle cx="0" cy="0" r="12" stroke="#00d084" stroke-opacity="0.5" stroke-width="1">
      <animate attributeName="r" values="5;15;5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#00d084" filter="url(#radarGlow)"/>
    <text x="12" y="4" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">DV-01 Danum Valley [Primary Canopy]</text>
  </g>

  <!-- Blip 3: Crocker Range -->
  <g transform="translate(160, 190)">
    <circle cx="0" cy="0" r="12" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1">
      <animate attributeName="r" values="5;14;5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#radarGlow)"/>
    <text x="12" y="4" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">CR-09 Crocker Range [1,650m Cloud Forest]</text>
  </g>

  <!-- Blip 4: Rajang Basin -->
  <g transform="translate(360, 390)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <text x="12" y="4" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">RB-02 Rajang Catchment [Stream Sensor]</text>
  </g>

  <!-- Compass Bearing Markers -->
  <text x="300" y="28" text-anchor="middle" fill="#00d084" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">000° N</text>
  <text x="575" y="304" text-anchor="end" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">090° E</text>
  <text x="300" y="580" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">180° S</text>
  <text x="25" y="304" text-anchor="start" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">270° W</text>

  <!-- Center Origin Core -->
  <circle cx="300" cy="300" r="4" fill="#00d084" filter="url(#radarGlow)"/>
</svg>